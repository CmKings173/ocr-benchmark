[project]
name = "ocr-benchmark"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.7", "PyYAML>=6.0", "Pillow>=10.0", "psutil>=5.9"]

[project.scripts]
ocr-bench = "ocr_benchmark.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
