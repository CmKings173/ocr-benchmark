# Hugging Face-backed OpenAI-compatible VLM deployments.
# Start exactly one server at a time on the matching port before benchmarking.
models:
  monkey_ocr_v2_b_parsing:
    adapter: monkey_ocr_v2_b_parsing
    endpoint: http://127.0.0.1:8104/v1
    model: zenosai/MonkeyOCRv2-B-Parsing
    max_tokens: 4096
    verify_model: true
    revision: HF_MAIN
    license_status: VERIFY_REQUIRED
  qwen2_vl_7b:
    adapter: qwen2_vl_7b
    endpoint: http://127.0.0.1:8101/v1
    model: Qwen/Qwen2-VL-7B-Instruct
    max_tokens: 2048
    verify_model: true
    revision: HF_MAIN
    license_status: Apache-2.0
  surya_ocr_2:
    adapter: surya_ocr_2
    endpoint: http://127.0.0.1:8102/v1
    model: datalab-to/surya-ocr-2
    max_tokens: 4096
    verify_model: true
    revision: HF_MAIN
    license_status: VERIFY_REQUIRED
  deepseek_ocr:
    adapter: deepseek_ocr
    endpoint: http://127.0.0.1:8103/v1
    model: deepseek-ai/DeepSeek-OCR
    max_tokens: 4096
    verify_model: true
    revision: HF_MAIN
    license_status: MIT
  # HunyuanOCR-1.5 official vLLM server (inference/vLLM/serve.sh).
  hunyuan_ocr_1_5:
    adapter: hunyuan_ocr_1_5
    endpoint: http://127.0.0.1:8107/v1
    model: tencent/HunyuanOCR
    task_type: spotting_json
    max_tokens: 32768
    timeout_seconds: 3600
    verify_model: true
    revision: HF_MAIN
    license_status: tencent-hunyuan-community
  # Unlimited-OCR dedicated vLLM recipe; launch with the official custom
  # image and NGramPerReqLogitsProcessor server flag.
  unlimited_ocr:
    adapter: unlimited_ocr
    endpoint: http://127.0.0.1:8106/v1
    model: baidu/Unlimited-OCR
    max_tokens: 32768
    image_mode: gundam
    ngram_size: 35
    ngram_window: 128
    timeout_seconds: 1200
    verify_model: true
    revision: HF_MAIN
    license_status: MIT
  # dots.mocr official vLLM integration.
  dots_mocr:
    adapter: dots_mocr
    endpoint: http://127.0.0.1:8108/v1
    model: rednote-hilab/dots.mocr
    prompt_mode: prompt_layout_all_en
    max_tokens: 32768
    timeout_seconds: 1200
    verify_model: true
    revision: HF_MAIN
    license_status: MIT
