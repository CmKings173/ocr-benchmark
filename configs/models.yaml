models:
  ppocr_v6:
    adapter: ppocr_v6
    det_model: PP-OCRv6_medium_det
    rec_model: PP-OCRv6_medium_rec
    device: gpu:0
    revision: VERIFY_REQUIRED
    license_status: VERIFY_REQUIRED
  glm_ocr:
    adapter: glm_ocr
    endpoint: http://127.0.0.1:8080/v1
    model: glm-ocr
    max_tokens: 2048
    verify_model: true
    revision: VERIFY_REQUIRED
    license_status: VERIFY_REQUIRED
  paddleocr_vl_1_6:
    adapter: paddleocr_vl_1_6
    device: gpu:0
    # PaddleOCR-VL native startup/inference can exceed the generic 60s
    # benchmark timeout, especially on CPU-only aarch64 installations.
    timeout_seconds: 300
    revision: VERIFY_REQUIRED
    license_status: VERIFY_REQUIRED
  monkey_ocr_v2_b_parsing:
    adapter: monkey_ocr_v2_b_parsing
    endpoint: http://127.0.0.1:8000/v1
    model: MonkeyOCRv2-B-Parsing
    revision: VERIFY_REQUIRED
    license_status: VERIFY_REQUIRED
  monkey_ocr_v2_b_parsing_native:
    adapter: monkey_ocr_v2_b_parsing_native
    model_id: zenosai/MonkeyOCRv2-B-Parsing
    device_map: auto
    dtype: auto
    max_new_tokens: 4096
    revision: HF_MAIN
    license_status: VERIFY_REQUIRED
  surya_ocr_2:
    adapter: surya_ocr_2
  deepseek_ocr:
    adapter: deepseek_ocr
  qwen2_vl_7b:
    adapter: qwen2_vl_7b
  donut:
    adapter: donut
  layoutlmv3_kie:
    adapter: layoutlmv3_kie
  mistral_ocr4:
    adapter: mistral_ocr4
    endpoint: ""
  hunyuan_ocr_1_5:
    adapter: hunyuan_ocr_1_5
    endpoint: http://127.0.0.1:8107/v1
    model: tencent/HunyuanOCR
    task_type: spotting_json
    max_tokens: 32768
    verify_model: true
    timeout_seconds: 3600
    revision: HF_MAIN
    license_status: tencent-hunyuan-community
  unlimited_ocr:
    adapter: unlimited_ocr
    endpoint: http://127.0.0.1:8106/v1
    model: baidu/Unlimited-OCR
    image_mode: gundam
    ngram_size: 35
    ngram_window: 128
    max_tokens: 32768
    verify_model: true
    timeout_seconds: 1200
    revision: HF_MAIN
    license_status: MIT
  dots_mocr:
    adapter: dots_mocr
    endpoint: http://127.0.0.1:8108/v1
    model: rednote-hilab/dots.mocr
    prompt_mode: prompt_layout_all_en
    max_tokens: 32768
    verify_model: true
    timeout_seconds: 1200
    revision: HF_MAIN
    license_status: MIT
