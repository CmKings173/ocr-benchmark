benchmark:
  warmup_iterations: 1
  accuracy_iterations_per_image: 1
  performance_min_iterations: 1
  performance_repetitions: 1
  batch_sizes: [1]
  concurrency: [1]
  timeout_seconds: 60
  output_dir: results
  production_gates: {}
  gate_policy:
    enforce_on_v1_100_images: false
    confidence_level: 0.95
  score_weights:
    full_label_accuracy: 0.5
    critical_field_accuracy: 0.3
    latency_score: 0.1
    reliability_score: 0.1
  allowed_tags: [clear, blur, rotated, reflection, dark, small_text, damaged, long_distance, vietnamese, vietnamese_mixed, mixed, chinese_simplified, chinese_traditional, japanese]
